[package]
name = "rust-intel-desktop"
version = "0.6.1"
description = "Rust Intelligence Desktop — локальный анализ публичной игровой активности Rust"
authors = ["RID contributors"]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[lib]
name = "rid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
url = "2.5"
regex = "1.13"
async-trait = "0.1"
uuid = { version = "1.29", features = ["v4"] }
keyring = "4.2.0"
prost = "0.14.4"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1.0.11"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
rand = "0.9"

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
