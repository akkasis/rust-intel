name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Тесты — только вручную (Actions → CI → Run workflow), чтобы .exe собирался быстрее.
  test:
    name: Lint & tests (windows-latest)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Frontend typecheck / lint / unit
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Frontend build
        run: npx vite build
      - name: Rust fmt / clippy / test
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: e2e (Playwright, браузерный mock)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  bundle:
    name: Windows exe + installer (windows-latest)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build NSIS installer
        run: npx tauri build --bundles nsis
      - name: Smoke-test release binary starts
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release -Filter "rust-intel-desktop.exe" | Select-Object -First 1
          if (-not $exe) { throw "exe не найден" }
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Приложение завершилось с кодом $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 1
          $log = (Get-Content smoke-out.log, smoke-err.log -Raw -ErrorAction SilentlyContinue) -join ""
          Write-Host $log
          if ($log -match "get_app_info") { Write-Host "UI загрузился и подключился к ядру" }
          else { Write-Host "::warning::Не удалось подтвердить загрузку интерфейса по логу" }
      - name: Prepare portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/rust-intel-desktop.exe out/RustIntelligence.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/RustIntelligence-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rid-windows-x64-portable
          path: out/RustIntelligence.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rid-windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish rolling release "latest"
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete latest --yes --cleanup-tag }
          $notes = "Сборка из коммита $env:GITHUB_SHA.`n`nRustIntelligence.exe — портативная версия: скачать и запустить, установка не нужна (нужен WebView2, он есть в Windows 10/11).`nRustIntelligence-setup.exe — установщик (ярлыки, удаление через «Приложения»)."
          gh release create latest out/RustIntelligence.exe out/RustIntelligence-setup.exe --title "Rust Intelligence Desktop (последняя сборка)" --notes $notes --target $env:GITHUB_SHA
